name: Verify Morning AI smoke

on:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Wait for production one-shot AI smoke
        shell: bash
        run: |
          set -u
          URL="https://luna-core.kita0905-game.workers.dev/morning/status"
          for i in $(seq 1 40); do
            BODY="$(curl -fsS --max-time 10 "$URL" 2>/dev/null || true)"
            if [ -n "$BODY" ]; then
              echo "$BODY" | jq -c '{model:.config.model,budgetTimeZone:.config.budgetTimeZone,latest:.state.latest}' || true
              TRIGGER="$(echo "$BODY" | jq -r '.state.latest.trigger // empty' 2>/dev/null || true)"
              STATUS="$(echo "$BODY" | jq -r '.state.latest.status // empty' 2>/dev/null || true)"
              MODEL="$(echo "$BODY" | jq -r '.config.model // empty' 2>/dev/null || true)"
              ZONE="$(echo "$BODY" | jq -r '.config.budgetTimeZone // empty' 2>/dev/null || true)"
              if [ "$TRIGGER" = "ai-smoke" ]; then
                if [ "$MODEL" != "gpt-6-luna" ] || [ "$ZONE" != "UTC" ]; then
                  echo "Smoke ran on unexpected model/budget timezone."
                  exit 1
                fi
                if [ "$STATUS" = "generated_unpublished" ]; then
                  echo "Production Morning AI smoke succeeded."
                  exit 0
                fi
                echo "Production Morning AI smoke completed with failure status: $STATUS"
                echo "$BODY"
                exit 1
              fi
            fi
            sleep 15
          done
          echo "Timed out waiting for production Morning AI smoke."
          exit 1
